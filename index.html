<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="main">
      <div class="left">
        <figure class="image">
          <img src="img/myimage.jpeg" alt="" />
        </figure>
        <h1>Nilofar Noori</h1>
        <h2>UI/UX Designer</h2>
        <h3>In Afghanistan</h3>
        <ul class="list">
          <li>Home</li>
          <li>About</li>
          <li>Skills</li>
          <li>
            <button class="btn"><a href="#contact">Contact Me</a></button>
          </li>
        </ul>
      </div>
      <div class="right">
        <figure class="text">
          <h1 class="name">
            <span>I am</span>
            <br />
            <span> a Designer</span>
          </h1>
          <p>HTML, CSS, Bootstrap</p>
        </figure>
      </div>
    </section>

    <section class="projects">
      <h2>My Projects</h2>
      <div class="Pcon">
        <div class="project-card">
          <figure class="fimage">
            <img src="img/portfolio.jpg" alt="" />
          </figure>
          <h3>Portfolio Website</h3>
          <p>My first portfolio website.</p>
        </div>

        <div class="project-card">
          <figure class="simage">
            <img src="img/job form .jpg" alt="second Project " />
          </figure>
          <h3>Project Two</h3>
          <p>My second web project.</p>
        </div>

        <div class="project-card">
          <figure class="pimage">
            <img src="img/table .jpg" alt="project three" />
          </figure>
          <h3>Project Three</h3>
          <p>My third web project.</p>
        </div>
      </div>
    </section>

    <section id="contact">
      <h3>Contact Me</h3>
      <p>Feel free to send me a message</p>

      <form action="">
        <label for="name">Full Name</label>
        <input type="Full Name" required />

        <label for="email">Email Address</label>
        <input type="email" />

        <label for="message">Message</label>
        <textarea name="Message" id="message">
          </textarea
        >
        <button type="submit">Submit</button>
      </form>
    </section>
    <footer>
      <p>© Copyright © 2026 All rights reserved</p>
    </footer>
  </body>
  <script>
    const textarea = document.getElementById('message')

    const Default = 'Type your message here....';
    textarea.value = Default

    textarea.addEventListener('click',()=>{
      if(textarea.value === Default){
        textarea.value = '';
      }
    })

    textarea.addEventListener('blur',()=>{
      if(textarea.value === ''){
        textarea.value = Default
      }
    })

  </script>
</html>
